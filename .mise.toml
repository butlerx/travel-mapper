[tools]
rust                   = { version = "stable", profile = "default", components = "rust-analyzer" }
node                   = "lts"
prek                   = "latest"
tombi                  = "latest"
zizmor                 = "latest"
"cargo:cargo-binstall" = "latest"
"cargo:cargo-nextest"  = "0.9.129"
"cargo:cargo-watch"    = "latest"
"cargo:sqlx-cli"       = { version = "latest", features = "sqlite" }
"npm:prettier"         = "latest"
"npm:typescript"       = "latest"
"npm:esbuild"          = "latest"
protoc                 = "latest"

[settings]
experimental   = true
lockfile       = true
cargo.binstall = true

[env]
_.file = ".env"

[tasks.build]
description = "Build the project"
usage       = 'arg "[args]" var=#true help="Additional arguments passed to cargo build"'
run         = "cargo build ${usage_args:-}"
alias       = "b"
depends     = ["client:build"]
sources     = ["Cargo.lock", "Cargo.toml", "src/**/*.rs", "static/**/*"]
outputs     = ["target/debug/travel-mapper"]

[tasks."build:release"]
description = "Build release binary"
usage       = 'arg "[args]" var=#true help="Additional arguments passed to cargo build"'
run         = "cargo build --release ${usage_args:-}"
sources     = ["Cargo.lock", "Cargo.toml", "src/**/*.rs"]
outputs     = ["target/release/travel-mapper"]

[tasks.dev]
description = "Start server and sync worker together"
depends     = ["seed", "serve", "worker"]
wait_for    = []

[tasks.serve]
description = "Start the server with auto-reload on changes"
# Only watch compile inputs the server binary actually uses: Rust source, the
# `static/` assets it embeds via include_str!, and the embedded migrations.
# Avoids restart loops from the runtime SQLite DB, uploaded attachments, logs, etc.
run         = "cargo watch -w src -w static -w migrations -w Cargo.toml -w Cargo.lock -x 'run -- serve'"

[tasks.worker]
description = "Start the background sync worker"
# The worker does not serve `static/`, so changes there should not restart it.
run         = "cargo watch -w src -w migrations -w Cargo.toml -w Cargo.lock -x 'run -- worker'"

[tasks.lint]
description = "Lint code with clippy"
usage       = 'arg "[args]" var=#true help="Additional arguments passed to cargo clippy"'
run         = "cargo clippy --all-targets --all-features ${usage_args:-} -- -D warnings"

[tasks."lint:fix"]
description = "Fix lint issues"
usage       = 'arg "[args]" var=#true help="Additional arguments passed to cargo clippy"'
run         = "cargo clippy --fix --all-targets --all-features --allow-staged ${usage_args:-} -- -D warnings"

[tasks.format]
description = "Format Rust code with cargo fmt and JS/CSS/TS with Prettier"
run         = [
  "cargo fmt",
  "prettier --write 'static/**/*.css' 'client/**/*.ts'"
]
alias       = "f"
sources     = ["static/**/*.css", "client/**/*.ts", "src/**/*.rs"]

[tasks."format:check"]
description = "Check Rust code formatting with cargo fmt and JS/CSS/TS with Prettier"
run         = [
  "cargo fmt --check ",
  "prettier --check 'static/**/*.css' 'client/**/*.ts'",
]
sources     = ["static/**/*.css", "client/**/*.ts", "src/**/*.rs"]

[tasks.check]
description = "Run all checks (lint + format + typecheck)"
depends     = ["lint", "format:check", "client:check"]

[tasks.test]
description = "Run tests with cargo"
usage       = 'arg "[args]" var=#true help="Additional arguments passed to cargo test"'
run         = "cargo nextest run --all-targets --all-features ${usage_args:-}"
alias       = "t"

[tasks."db:create"]
description = "Create the SQLite database"
run         = "sqlx database create"

[tasks."db:migrate"]
description = "Run database migrations"
run         = "sqlx migrate run"
depends     = ["db:create"]

[tasks."db:reset"]
description = "Drop and recreate the database, then run migrations"
run         = [
  "sqlx database drop -y",
  "sqlx database create",
  "sqlx migrate run"
]

[tasks."db:prepare"]
description = "Generate .sqlx/ query cache for offline compile-time checking"
run         = "cargo sqlx prepare -- --all-targets"
depends     = ["db:migrate"]
sources     = ["src/**/*.rs", "migrations/*.sql"]
outputs     = [".sqlx/*.json"]

[tasks."wasm:build"]
description = "Build the map WASM module"
run         = "wasm-pack build crates/map-wasm --target web --out-dir ../../static/wasm"
sources     = ["crates/map-wasm/src/**/*.rs", "crates/map-wasm/Cargo.toml"]
outputs     = ["static/wasm/map_wasm_bg.wasm", "static/wasm/map_wasm.js"]

[tasks."client:build"]
description = "Bundle TypeScript map modules into static JS"
run         = [
  "esbuild client/map.ts client/stats-map.ts client/journey-map.ts client/trip-map.ts --bundle --format=esm --outdir=static/js --external:/static/wasm/* --target=es2022",
  "esbuild client/nav.ts client/push.ts client/add-journey.ts client/auto-submit.ts client/settings-copy.ts client/sw-register.ts client/edit-panel.ts client/trip-detail.ts client/upcoming-poll.ts client/shared-journey-poll.ts --bundle --format=iife --outdir=static/js --target=es2022",
]
depends     = ["wasm:build"]
sources     = ["client/**/*.ts"]
outputs     = [
  "static/js/map.js",
  "static/js/stats-map.js",
  "static/js/journey-map.js",
  "static/js/trip-map.js",
  "static/js/nav.js",
  "static/js/push.js",
  "static/js/add-journey.js",
  "static/js/auto-submit.js",
  "static/js/settings-copy.js",
  "static/js/sw-register.js",
  "static/js/edit-panel.js",
  "static/js/trip-detail.js",
  "static/js/upcoming-poll.js",
  "static/js/shared-journey-poll.js"
]

[tasks."client:check"]
description = "Type-check client TypeScript"
run         = "tsc --noEmit"
sources     = ["client/**/*.ts", "tsconfig.json"]

[tasks.seed]
description = "Seed the database with test users for local development"
run         = "cargo run -- seed"
depends     = ["db:migrate"]

[tasks."fix-tripit"]
description = "Detect and fix incorrect station addresses in TripIt"
usage       = 'arg "<username>" help="Username to fix TripIt data for" flag "--apply" help="Push corrections to TripIt (dry-run without this)"'
run         = "cargo run -- fix-tripit --username ${usage_username} ${usage_apply:+--apply}"

[tasks.clean]
description = "Clean build artifacts"
run         = "rm -rf target"

[tasks."ci:release-build"]
description = "Build release binary, using cross for cross-compilation when CROSS=true"
usage       = 'arg "<target>" help="Rust target triple"'
run         = '''cross build --release --target "${usage_args}"'''
hide        = true

[tasks."ci:package"]
description = "Package a release binary into a .tar.gz archive"
usage       = 'arg "<target>" help="Rust target triple"'
run         = "tar czf travel-mapper-${usage_args}.tar.gz -C target/${usage_args}/release travel_mapper"
hide        = true

[tasks."ci:publish"]
description = "Create a GitHub Release and upload artifacts"
usage       = 'arg "<tag>" help="Git tag for the release"'
run         = "gh release create ${usage_args} --title ${usage_args} --generate-notes artifacts/*.tar.gz"
hide        = true
