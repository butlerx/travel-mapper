# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo  = "https://github.com/pre-commit/pre-commit-hooks"
rev   = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"                                                                                                                                                                                      # frozen: v6.0.0
hooks = [{ id = "trailing-whitespace" }, { id = "end-of-file-fixer" }, { id = "check-toml" }, { id = "check-yaml" }, { id = "check-json" }, { id = "check-merge-conflict" }, { id = "check-added-large-files", exclude = "(?x).png" }]

[[repos]]
repo  = "https://github.com/tombi-toml/tombi-pre-commit"
rev   = "1066584123cce44a99b4818c2b2c4a7e732ff8e9"        # frozen: v1.11.3
hooks = [{ id = "tombi-format" }, { id = "tombi-lint" }]

[[repos]]
repo  = "https://github.com/rhysd/actionlint"
rev   = "914e7df21a07ef503a81201c76d2b11c789d3fca"  # frozen: v1.7.12
hooks = [{ id = "actionlint" }]

[[repos]]
repo  = "https://github.com/google/yamlfmt"
rev   = "21ca5323a9c87ee37a434e0ca908efc0a89daa07"  # frozen: v0.21.0
hooks = [{ id = "yamlfmt" }]

[[repos]]
repo  = "https://github.com/zizmorcore/zizmor-pre-commit"
rev   = "c7d31dc612dffdd4d3b2f2b88b9660d3ab057ee8"                                        # frozen: v1.33.1
hooks = [{ id = "zizmor", pass_filenames = false, args = ["--no-progress", ".github"] }]

[[repos]]
repo  = "https://github.com/doublify/pre-commit-rust"
rev   = "eeee35a89e69d5772bdee97db1a6a898467b686e"                                              # frozen: v1.0
hooks = [{ id = "fmt" }, { id = "clippy", args = ["--all-features", "--", "-D", "warnings"] }]

[[repos]]
repo  = "local"
hooks = [
  # Prettier formats the static CSS and the client TypeScript; mise installs it.
  { id = "prettier", name = "prettier", language = "system", entry = "prettier --check", types_or = ["css", "ts"] }
]

[[repos]]
repo  = "https://github.com/compilerla/conventional-pre-commit"
rev   = "33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8"                     # frozen: v4.5.0
hooks = [{ id = "conventional-pre-commit", stages = ["commit-msg"] }]
