version: 2

updates:
  - package-ecosystem: 'cargo'
    directory: '/'
    schedule:
      interval: 'weekly'
    groups:
      leptos-stack:
        patterns:
          - 'leptos*'
          - 'wasm-bindgen*'
          - 'js-sys'
          - 'web-sys'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      include: 'scope'
    cooldown:
      default-days: 7
    ignore:
      # aide 0.15 (latest stable) requires schemars 0.9; drop this once aide
      # ships a stable release on schemars 1.
      - dependency-name: 'schemars'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
