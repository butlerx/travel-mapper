[package]
name        = "travel_mapper"
version     = "0.1.3"
edition     = "2024"
description = "TripIt travel history web server with API and SQLite storage"
homepage    = "https://github.com/butlerx/travel-mapper"
license     = "Apache-2.0"

[features]
ssr = ["leptos/ssr"]

[dependencies]
aes-gcm                     = "0.10"
aide                        = { version = "0.15", features = ["axum", "axum-extra-cookie", "axum-form", "axum-json", "axum-query", "swagger"] }
airport-data                = "1.0"
argon2                      = "0.6"
async-trait                 = "0.1"
axum                        = { version = "0.8", features = ["multipart"] }
axum-extra                  = { version = "0.10", features = ["cookie"] }
base64                      = "0.22"
chrono                      = { version = "0.4", default-features = false }
clap                        = { version = "4", features = ["derive", "env"] }
csv                         = "1"
deunicode                   = "1.6.2"
governor                    = { version = "0.10", default-features = false, features = ["jitter", "std"] }
gtfs-realtime               = "0.2"
gtfs-structures             = "0.48"
hmac                        = "0.13"
icalendar                   = "0.17"
indexmap                    = "2"
leptos                      = { version = "0.8" }
lettre                      = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-native-tls"] }
mail-parser                 = { version = "0.11.3", features = ["encoding_rs"] }
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
nominatim                   = "0.3"
opentelemetry               = "0.33"
opentelemetry-otlp          = { version = "0.33", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk           = { version = "0.33", features = ["rt-tokio", "trace"] }
percent-encoding            = "2"
prost                       = "0.14"
quick-xml                   = "0.42"
rand                        = "0.9"
regex                       = "1"
reqwest                     = { version = "0.13", features = ["form", "json", "query"] }
rpassword                   = "7"
schemars                    = { version = "0.9", features = ["uuid1"] }
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
serde_urlencoded            = "0.7"
sha1                        = "0.11"
sha2                        = "0.11"
sqlx                        = { version = "0.9", features = ["macros", "runtime-tokio", "sqlite"] }
strsim                      = "0.11.1"
tempfile                    = "3.27.0"
thiserror                   = "2"
tokio                       = { version = "1", features = ["full"] }
tower-http                  = { version = "0.7", features = ["cors", "request-id"] }
tower-telemetry             = { version = "0.3", features = ["axum", "process-metrics", "runtime-metrics"] }
tracing                     = "0.1"
tracing-opentelemetry       = "0.34"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "json"] }
url                         = "2"
uuid                        = { version = "1", features = ["v4"] }
web-push                    = "0.11"
zip                         = "8.4.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

# Build OpenSSL from source so Linux and macOS release targets can
# cross-compile web-push's OpenSSL dependency without target libraries.
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[lints]
workspace = true

[workspace]
members = ["crates/map-wasm"]

[workspace.lints.clippy]
all             = { level = "warn", priority = -1 }
# Matters of taste: how tests check emptiness, how things are named, and match arms kept apart
# because each is its own case in the spec.
assert_is_empty = "allow"

# `module.rs` + `module/`, never `mod.rs`.
mod_module_files = "warn"
pedantic         = { level = "warn", priority = -1 }
perf             = { level = "deny", priority = -1 }
# `.expect("why it cannot fail")` documents the invariant; a bare `.unwrap()` does not.
unwrap_used      = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
strip = true
lto   = true
